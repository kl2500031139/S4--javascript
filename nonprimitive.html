<!DOCTYPE html>
<html>
<head>
    <title>Primitive and Non-Primitive Types</title>
</head>

<body>

    <p id="person"></p>

    <script>
        let person = {
            name: "ojesvi",
            age: 18,
            mobile: 63096240989
        };

        let result = '';

        result += 'Name: ' + person.name;
        result += '<br>Age: ' + person.age;
        result += '<br>Mobile: ' + person.mobile;

        document.getElementById('person').innerHTML = result;
    </script>

</body>
</html>
