<!DOCTYPE html>
<html>
    <head>
        <title> javascript examples</title>
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vi;
            background-color: #f4f6f9;
        }

        .calculator {
            width: 360px;
            background-color: #17181c;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .display {
            width: 100%;
            height: 80px;
            background-color: #17181c;
            border: none;
            color: #ffffff;
            text-align: right;
            padding: 10px 15px;
            font-size: 2.5rem;
            margin-bottom: 20px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.15s ease;
            aspect-ratio: 1;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Number button styles */
        .btn-number {
            background-color: #333333;
            color: #ffffff;
        }
        .btn-number:hover {
            background-color: #444444;
        }

        /* Operator button styles */
        .btn-operator {
            background-color: #ff9f0a;
            color: #ffffff;
        }
        .btn-operator:hover {
            background-color: #cc7f08;
        }

        /* Function button styles (Clear, Delete) */
        .btn-function {
            background-color: #a5a5a5;
            color: #000000;
        }
        .btn-function:hover {
            background-color: #8e8e8e;
        }

        /* Zero span across columns */
        .btn-zero {
            grid-column: span 2;
            border-radius: 30px;
            aspect-ratio: auto;
        }
        </style>
        
    </head>
    <body>
         <div class="calculator">
        <!-- Display Screen -->
        <input type="text" class="display" id="screen" readonly value="0">

        <!-- Calculator Pad -->
        <div class="buttons">
            <button class="btn-function" onclick="clearScreen()">C</button>
            <button class="btn-function" onclick="deleteLast()">DEL</button>
            <button class="btn-operator" onclick="appendOperator('%')">%</button>
            <button class="btn-operator" onclick="appendOperator('/')">÷</button>

            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('*')">×</button>

            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="appendOperator('-')">−</button>

            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>

            <button class="btn-number btn-zero" onclick="appendNumber('0')">0</button>
            <button class="btn-number" onclick="appendNumber('.')">.</button>
            <button class="btn-operator" onclick="calculate()">=</button>
        </div>
    </div>
     <script>
        const screen = document.getElementById('screen');

        function appendNumber(number) {
            if (screen.value === '0' && number !== '.') {
                screen.value = number;
            } else {
                // Prevent duplicate decimals
                if (number === '.' && screen.value.includes('.')) {
                    // Basic separation check to allow decimals in multiple numbers
                    const parts = screen.value.split(/[\+\-\*\/%]/);
                    if (parts[parts.length - 1].includes('.')) return;
                }
                screen.value += number;
            }
        }

        function appendOperator(operator) {
            const lastChar = screen.value.slice(-1);
            // Replace operator if user changes mind
            if (['+', '-', '*', '/', '%'].includes(lastChar)) {
                screen.value = screen.value.slice(0, -1) + operator;
            } else {
                screen.value += operator;
            }
        }

        function clearScreen() {
            screen.value = '0';
        }

        function deleteLast() {
            if (screen.value.length > 1) {
                screen.value = screen.value.slice(0, -1);
            } else {
                screen.value = '0';
            }
        }

        function calculate() {
            try {
                // Evaluate mathematical string safely 
                let result = Function('"use strict";return (' + screen.value + ')')();
                
                // Format decimals nicely if they are too long
                if (result % 1 !== 0) {
                    result = Math.round(result * 100000) / 100000;
                }
                
                screen.value = result;
            } catch (error) {
                screen.value = 'Error';
                setTimeout(clearScreen, 1500);
            }
        }
    </script>
     

    </body>
</html>
