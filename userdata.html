<!DOCTYPE html>
<html>
    <head>
        <title> User Data</title>
    </head>
    <body>
        <h3 style="text-align: center;text-decoration: underline;">User Data</h3>
        <table id="user">
        <script>
            async function getchData() {
                try{

                
                let response = await fetch('https://jsonplaceholder.typicode.com/users');
                let data = await response.json();
                return data;
                }catch(error){
                    console.log("Error: ",+error);
                }
            }
            async function showData(){
                try{
                let data = await getchData();
                const table = document.getElementById('user');
                table.setAttribute('border', '1');
                table.setAttribute('align', 'center');
                const row = document.createElement('tr');
                const thead = document.createElement('th');
                const text = document.createElement('Name');
                const thead1 = document.createElement('th');
                const text1 = document.createTextNode('Email');
                const thead2 = document.createElement('th');
                const text2 = document.createTextNode('phone No');
                thead.appendChild(text);
                thead1.appendChild(text1);
                thead2.appendChild(text2);
                row.appendChild(thead);
                row.appendChild(thead1);
                row.appendChild(thead2);
                table.appendChild(row);
                data.forEach((user) => {
                 table.innerHTML += `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                </tr>`
                });
                }catch(error){
                    console.log( error);
                }
            }
            showData();
        </script>
    </body>
</html>
